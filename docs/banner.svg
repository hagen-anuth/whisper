<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">whisper</title>
  <desc id="desc">One-time secret links, encrypted in your browser.</desc>
  <defs>
    <clipPath id="card">
      <rect width="1280" height="320" rx="24"/>
    </clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ff"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#14121c"/>
    <g filter="url(#blur)">
      <circle cx="180" cy="80" r="190" fill="#5a3fc0"/>
      <circle cx="760" cy="300" r="200" fill="#1f6f86"/>
      <circle cx="1150" cy="60" r="170" fill="#8a2c62"/>
    </g>
    <rect width="1280" height="320" fill="#14121c" fill-opacity=".45"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="319" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".1"/>

  <!-- app icon, scaled from src/app/icon.svg -->
  <g transform="translate(96 96) scale(4)">
    <rect width="32" height="32" rx="8" fill="url(#icon)"/>
    <path fill="#fff" d="M9.5 7.5h13a3.5 3.5 0 0 1 3.5 3.5v7.5a3.5 3.5 0 0 1-3.5 3.5h-6.2l-4.6 3.6a.6.6 0 0 1-1-.47V22h-1.2A3.5 3.5 0 0 1 6 18.5V11a3.5 3.5 0 0 1 3.5-3.5z"/>
    <circle cx="16" cy="13.2" r="2.1" fill="#5b6cf0"/>
    <rect x="15.05" y="14" width="1.9" height="4.3" rx=".95" fill="#5b6cf0"/>
  </g>

  <g font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="272" y="168" font-size="88" font-weight="700" letter-spacing="-3" fill="url(#word)">whisper<tspan fill="#8b87a3">.</tspan></text>
    <text x="276" y="214" font-size="26" fill="#cfcbe0" fill-opacity=".85">One-time secret links, encrypted in your browser.</text>
  </g>

  <!-- share-link pill -->
  <g transform="translate(880 132)">
    <rect width="300" height="56" rx="28" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
    <circle cx="30" cy="28" r="6" fill="#22b8cf"/>
    <text x="50" y="36" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#e6e3f2">/s/7f3a<tspan fill="#8b87a3">#k=</tspan>••••••••</text>
  </g>
</svg>
