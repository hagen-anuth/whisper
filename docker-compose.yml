# Local stand-in for Upstash: plain Redis behind serverless-redis-http, which
# speaks the same REST protocol as @upstash/redis.
services:
    redis:
        image: redis:7-alpine
    redis-http:
        image: hiett/serverless-redis-http:latest
        ports:
            - '8079:80'
        environment:
            SRH_MODE: env
            SRH_TOKEN: local-dev-token
            SRH_CONNECTION_STRING: redis://redis:6379
        depends_on:
            - redis
